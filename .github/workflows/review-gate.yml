name: Review gate

# Turns Claude's newest review of a pull request into the "Review gate" check, which merging waits
# for (scripts/review-gate.ts). It runs from main whatever the pull request changes, and reads the
# pull request only through the API, never checking out its code, so a pull request can't change
# the gate that judges it. It runs when a pull request changes, when a review finishes, and when the
# README pictures job pushes a commit, which gets no other event.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_run:
    workflows: [Claude review]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: The pull request's number
        required: true

permissions: {}

concurrency:
  group: review-gate-${{ github.event.pull_request.number || inputs.pr || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  gate:
    name: Update the review gate
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      # Main's own script and areas, never the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/review-gate.ts
            .github/owner-areas.txt
            .node-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Judge the pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr || github.event.workflow_run.pull_requests[0].number }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: node scripts/review-gate.ts gate
