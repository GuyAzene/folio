name: Claude

# Claude answers @claude in issues and in a pull request's conversation. Only people with write
# access start it (the action checks), so nobody else spends the owner's Claude plan, which it
# runs on through CLAUDE_CODE_OAUTH_TOKEN. It may only read and comment; it cannot push.
#
# Comments on a pull request's changed lines are left out on purpose: each one starts a run on the
# pull request's latest commit, which lists among its checks as skipped whenever the comment does
# not mention @claude. Conversation comments run against main instead and stay out of that list.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

# A comment arriving while an answer is under way waits for it rather than replacing it.
concurrency:
  group: claude-answer-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  answer:
    name: Answer @claude
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Tag mode adds blanket read and git permissions. Keep its reply tool and downloaded
          # thread images, but exclude shell commands, project settings and runner credentials.
          # Every deny goes in one flag, so none depends on how repeated flags are merged.
          claude_args: |
            --tools "Read,Grep,Glob"
            --disallowedTools "Bash,Edit,Write,MultiEdit,NotebookEdit,Read(/.git),Read(/.git/**),Read(//proc/**),Read(/${{ runner.temp }}/**),Read(~/.claude/**),Read(~/.config/gh/**)"
            --add-dir /tmp/github-images
            --settings '{"permissions":{"blockReadsOutsideWorkingDirectories":true}}'
            --setting-sources user
            --strict-mcp-config
