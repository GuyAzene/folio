name: Review

# Claude's review of every push to a pull request from this repository, posted as one comment.
# scripts/review.ts does the work, and tests/review.test.ts holds this file to it. It runs from
# main, never from a pull request's branch: when the "Pull request" workflow signals a change, or by
# hand. The one job that reads the pull request's code holds no key but Claude's, runs nothing from
# it, and hands back only Claude's answer. The review is advice: nothing waits on it to merge.
on:
  workflow_run:
    workflows: [Pull request]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: The pull request's number
        required: true

permissions: {}

# One review of a pull request at a time. A signal that comes while one runs waits for it, then
# finds that commit reviewed; GitHub keeps only the newest of the signals that wait.
concurrency:
  group: review-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  PR: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr }}
  # A fork's pull request comes without its number: it is found by its branch, under its owner.
  BRANCH: ${{ github.event.workflow_run.head_branch }}
  HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}

jobs:
  start:
    name: Decide what to review
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.start.outputs.pr }}
      review: ${{ steps.start.outputs.review }}
      sha: ${{ steps.start.outputs.sha }}
      base: ${{ steps.start.outputs.base }}
      since: ${{ steps.start.outputs.since }}
      previous: ${{ steps.start.outputs.previous }}
      prompt: ${{ steps.start.outputs.prompt }}
      args: ${{ steps.start.outputs.args }}
    steps:
      # Main's own script, never the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/review.ts
            .node-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Decide
        id: start
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/review.ts start

  review:
    name: Claude reviews
    needs: start
    # Never a fork's code, whatever start decided: only this repository's own branches, which a
    # workflow_run names, or a pull request someone with write access asked for by hand.
    if: >-
      needs.start.outputs.review == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      review: ${{ steps.first.outcome == 'success' && steps.first.outputs.structured_output || steps.second.outputs.structured_output }}
    steps:
      # The pull request's files, to read. Nothing from them runs in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.start.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The changes to review
        env:
          SHA: ${{ needs.start.outputs.sha }}
          BASE: ${{ needs.start.outputs.base }}
          SINCE: ${{ needs.start.outputs.since }}
        run: |
          rm -rf /tmp/review && mkdir -p /tmp/review
          if [ -n "$SINCE" ]; then diff="$SINCE..$SHA"; log="$SINCE..$SHA"; else diff="$BASE...$SHA"; log="$BASE..$SHA"; fi
          git diff --no-ext-diff --no-textconv "$diff" > /tmp/review/changes.diff
          git log --format='%h %s%n%n%b' "$log" > /tmp/review/commits.txt
      # What the Claude CLI and the action read from the working directory as they start, the list
      # the action itself replaces with the base branch's on pull request events but not here.
      - name: Leave out what Claude would load from the pull request
        run: rm -rf .claude .mcp.json .claude.json .gitmodules .ripgreprc CLAUDE.md CLAUDE.local.md .husky
      - name: Claude reviews
        id: first
        continue-on-error: true
        uses: anthropics/claude-code-action@4845bacbb38b3c4b15d948f035349786f678e068 # v1.0.267
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ needs.start.outputs.prompt }}
          claude_args: ${{ needs.start.outputs.args }}
      # A plan limit or a passing outage: one more try, then the comment says the review couldn't
      # run, and the next signal tries again.
      - name: Wait a minute before trying again
        if: steps.first.outcome == 'failure'
        run: sleep 60
      - name: Claude reviews, second try
        id: second
        if: steps.first.outcome == 'failure'
        uses: anthropics/claude-code-action@4845bacbb38b3c4b15d948f035349786f678e068 # v1.0.267
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ needs.start.outputs.prompt }}
          claude_args: ${{ needs.start.outputs.args }}

  post:
    name: Post the review
    needs: [start, review]
    # Also when the review failed or was stopped, so the pull request hears why.
    if: always() && needs.start.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/review.ts
            .node-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Post the comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ needs.start.outputs.pr }}
          SHA: ${{ needs.start.outputs.sha }}
          SINCE: ${{ needs.start.outputs.since }}
          PREVIOUS: ${{ needs.start.outputs.previous }}
          REVIEW: ${{ needs.review.outputs.review }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: node scripts/review.ts post
