name: Claude review

# Claude reviews every push to a pull request from this repository's own branches: the whole pull
# request the first time, then only the changes since its last review, checking whether the
# serious findings it left are fixed. It answers in JSON; scripts/review-gate.ts posts that as a
# comment and as the "Review verdict" check, and the Review gate workflow turns the newest verdict
# into the "Review gate" check. It runs on the owner's Claude plan through CLAUDE_CODE_OAUTH_TOKEN
# and may only read the code: it can't push or comment itself. Answering @claude is claude.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A newer push makes the review of an older commit moot.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The comment, and the "Review verdict" check.
      pull-requests: write
      checks: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      # The branch's own commits, not the merge commit: reviews compare one commit with another.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: What this review covers
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/review-gate.ts prepare
      - name: Claude reviews
        id: first
        continue-on-error: true
        uses: anthropics/claude-code-action@4845bacbb38b3c4b15d948f035349786f678e068 # v1.0.267
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.scope.outputs.prompt }}
          claude_args: ${{ steps.scope.outputs.args }}
      # A plan limit or a passing outage: one more try, then the gate sends the pull request to
      # the owner.
      - name: Wait a minute before trying again
        if: steps.first.outcome == 'failure'
        run: sleep 60
      - name: Claude reviews, second try
        id: second
        if: steps.first.outcome == 'failure'
        uses: anthropics/claude-code-action@4845bacbb38b3c4b15d948f035349786f678e068 # v1.0.267
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.scope.outputs.prompt }}
          claude_args: ${{ steps.scope.outputs.args }}
      - name: Post the review and its verdict
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW: ${{ steps.first.outcome == 'success' && steps.first.outputs.structured_output || steps.second.outputs.structured_output }}
        run: node scripts/review-gate.ts publish
