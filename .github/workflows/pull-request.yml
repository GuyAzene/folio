name: Pull request

# Tells the Review workflow, which runs from main, that a pull request has something new to review.
# It does nothing else and holds no permissions or secrets: whatever a pull request changes here,
# its review is still decided by main's code.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

jobs:
  signal:
    name: Signal the review
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Signal
        env:
          PR: ${{ github.event.number }}
          ACTION: ${{ github.event.action }}
        run: echo "#$PR $ACTION. The Review workflow on main takes it from here."
