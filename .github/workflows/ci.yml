name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs every check on the tagged commit.
  workflow_call:
  # The README pictures job starts CI on the commit it pushes, which would otherwise get none.
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older run moot: it is cancelled, nightly build included. Runs the release
# workflow starts are kept apart by their event.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# The real-window checks run two files at a time: a macOS runner has three cores, and each file
# opens Electron windows. Each failure is also an annotation on the commit, which anyone can read,
# and the counts go to the run's summary.
env:
  TEST_FLAGS: >-
    --test-concurrency=2
    --test-reporter=spec --test-reporter-destination=stdout
    --test-reporter=./tests/electron/github-annotations.ts --test-reporter-destination=stdout

jobs:
  # Decides whether the macOS and Windows jobs run, and says why in the run's summary.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.files.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Files the macOS and Windows jobs depend on
        id: files
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then range="$BASE...$HEAD"; else range="$BEFORE..$GITHUB_SHA"; fi
          if [ "$EVENT" = workflow_dispatch ]; then
            # Started on its own, by the README pictures job or by hand: everything runs.
            files=""
            app=true
            why="this run was started on its own, so every check runs"
          elif files=$(git diff --name-only "$range" 2>/dev/null) && [ -n "$files" ]; then
            count=$(wc -l <<< "$files" | tr -d ' ')
            # Docs, Markdown at the root and in .github, GitHub's templates and settings, the
            # license and unit tests: nothing the macOS and Windows jobs build or check.
            others=$(grep -Ev '^(docs/.*|[^/]+\.md|\.github/([^/]+\.md|ISSUE_TEMPLATE/.*|release\.yml|dependabot\.yml)|LICENSE|\.gitignore|tests/.*\.test\.ts)$' <<< "$files" || true)
            if [ -n "$others" ]; then
              app=true
              why="$(wc -l <<< "$others" | tr -d ' ') of $count changed files are the app, its build or its checks"
            else
              app=false
              why="only docs, templates or unit tests changed ($count files)"
            fi
          else
            app=true
            why="the changed files could not be listed"
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          {
            if [ "$app" = true ]; then echo "**macOS and Windows checks run:** $why."; else echo "**macOS and Windows checks skipped:** $why."; fi
            if [ -n "$files" ]; then
              printf '\n<details><summary>Changed files</summary>\n\n```text\n%s\n```\n\n</details>\n' "$files"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    name: "Linux: checks, tests and build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the vp pinned in package.json, Node from .node-version and the dependencies,
      # with every package download checked by Socket Firewall.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          sfw: true
          cache: true
          cache-toolchain: true
          # Only pushes to main save caches; pull requests reuse them.
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Formatting, lint and types
        run: vp check
      - name: Interface checks
        run: vp run check:ui
      # On GitHub, Vitest also annotates failures and writes its counts to the run's summary.
      - name: Tests
        run: vp test
      - name: Build the interface
        run: vp build
      - name: Bundle the CLI and the Electron main process
        run: vp pack

  # The two macOS jobs run side by side: the real-window checks on a fresh build, and the
  # packaged app with the checks of what packaging can break.
  window:
    name: "macOS: Folio in a real window"
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          sfw: true
          cache: true
          cache-toolchain: true
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Electron
        run: vp node node_modules/electron/install.js
      # `vp run test:electron`, with the flags above.
      - name: Folio in a real window
        run: vp node --test $TEST_FLAGS tests/electron/*.e2e.ts

  packaged:
    name: "macOS: packaged app"
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          sfw: true
          cache: true
          cache-toolchain: true
          # The window job saves the same caches.
          cache-save: false
      - name: Electron
        run: vp node node_modules/electron/install.js
      - name: Package Folio.app
        run: vp run desktop:package
        env:
          # electron-builder skips signing on pull requests, ad-hoc signing included, and the
          # install check verifies the signature. Ad-hoc signing uses no secret.
          CSC_FOR_PULL_REQUEST: "true"
      # On the packaged app, the checks of what packaging can break: its protocols, permissions
      # and pages, pdf.js with canvas, one Folio per home, demos in their own processes, the
      # diagram renderer's workers, and `desktop:install` into temporary folders.
      - name: The packaged app in a real window, and installing it
        run: >-
          vp node --test $TEST_FLAGS
          tests/electron/window.e2e.ts tests/electron/runtime.e2e.ts
          tests/electron/instance.e2e.ts tests/electron/sandbox.e2e.ts
          tests/electron/diagrams.e2e.ts tests/electron/install.e2e.ts
        env:
          FOLIO_E2E_APP: ${{ github.workspace }}/release/mac-arm64/Folio.app

  # Folio on Windows: the unit tests, then the real-window checks on a fresh build, as the macOS
  # window job runs them. It reports on its own, like the nightly build, until it has shown it
  # passes reliably; packaging for Windows comes later.
  windows:
    name: "Windows: tests and Folio in a real window"
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          sfw: true
          # setup-vp's cache restores slower on Windows than installing afresh.
          cache: false
      - name: Electron
        run: vp node node_modules/electron/install.js
      - name: Tests
        run: vp test
      # `vp run test:electron`, with the flags above; after failed unit tests too, so one run
      # shows everything that fails on Windows.
      - name: Folio in a real window
        if: ${{ !cancelled() }}
        run: vp node --test $TEST_FLAGS tests/electron/*.e2e.ts

  # On a pull request that changes the app, the README pictures are retaken from the preview
  # (`vp run screenshots`), and those that look different are committed to the pull request's
  # branch, so they are reviewed with the change. A push with the workflow's token starts no
  # workflow, so this job starts CI on that commit itself: without it, the commit would never
  # get the CI check main requires. That run checks the branch as it is, not merged with main as
  # a pull request's run does; the commit only adds pictures to what was just checked merged.
  # Only this repository's own branches: Dependabot's and a fork's tokens can't push.
  pictures:
    name: "macOS: README pictures"
    needs: changes
    if: >-
      github.event_name == 'pull_request' && needs.changes.outputs.app == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      # Pushes the pictures to the pull request's branch, then starts CI on that commit.
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch's own commit, not the merge commit: the pictures go on top of it.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          sfw: true
          cache: true
          cache-toolchain: true
          cache-save: false
      - name: Electron
        run: vp node node_modules/electron/install.js
      - name: img2webp, which joins the clip's frames
        run: command -v img2webp >/dev/null || brew install webp
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
      - name: Retake the pictures
        run: vp run screenshots
      - name: Commit the pictures that changed
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          changed=$(git status --porcelain -- docs/images | cut -c4-)
          if [ -z "$changed" ]; then
            echo "**README pictures:** none looks different." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add -- docs/images
          # No hooks: nothing the pull request brought runs while the token is at hand.
          git -c core.hooksPath=/dev/null -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Retake the README pictures" -m "$changed"
          # Refused if the branch moved on meanwhile; the newer commit's own run retakes them.
          git -c core.hooksPath=/dev/null push --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
          {
            echo "**README pictures:** committed $(wc -l <<< "$changed" | tr -d ' ') to \`$BRANCH\`, and started CI on that commit:"
            echo
            sed 's/^/- /' <<< "$changed"
          } >> "$GITHUB_STEP_SUMMARY"

  # The one check a pull request needs: every job passed, or was skipped because nothing it
  # checks changed. A job skipped by its own condition counts as passed, so this is safe to
  # require where a workflow filtered by paths would leave the check pending. The README pictures
  # are waited for, so a pull request can't merge before its pictures are in, but they report on
  # their own: a picture that didn't come out holds no change back.
  ci:
    name: CI
    if: always()
    needs: [changes, check, window, packaged, pictures]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or had nothing to check
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.key != "pictures") | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::Not every job passed: $(paste -sd, - <<< "$failed")"
            exit 1
          fi

  # Waits for the Linux checks, tests and builds, not for the macOS jobs, which report on their
  # own: GitHub's virtual Macs are slower than the Macs those checks were written on.
  nightly:
    name: Nightly build
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      # Moves the nightly tag and replaces the release's disk image.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          sfw: true
          cache: true
          cache-toolchain: true
          cache-save: false
      - name: Electron
        run: vp node node_modules/electron/install.js
      - name: Package Folio for others
        run: vp run desktop:package
        env:
          FOLIO_DISTRIBUTE: "1"
      - name: Open and quit the packaged app
        run: .github/scripts/open-and-quit.sh
      - name: Publish the nightly build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp release/Folio-*-arm64.dmg Folio-arm64.dmg
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null
          fi
          cat > notes.md <<EOF
          The newest Folio, built from [\`${GITHUB_SHA::7}\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) on $(date -u '+%Y-%m-%d %H:%M UTC'). It is rebuilt after every change to \`main\`, so this page always has the latest.

          **Install:** download \`Folio-arm64.dmg\` (Apple silicon Macs), open it and drag Folio to Applications.

          **First open:** Folio is not signed with an Apple Developer ID, so macOS says it could not verify it. Open **System Settings → Privacy & Security**, scroll down to the line about Folio, and choose **Open Anyway**. A newer download may ask again.

          Your courses, notes and chats stay in \`~/.folio\` on your Mac. Folio connects to your own ChatGPT account.
          EOF
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Folio nightly" --notes-file notes.md
          else
            gh release create nightly --prerelease --verify-tag --title "Folio nightly" \
              --notes-file notes.md
          fi
          gh release upload nightly Folio-arm64.dmg --clobber
