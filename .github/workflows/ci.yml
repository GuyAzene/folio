name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the vp pinned in package.json, Node from .node-version and the dependencies,
      # with every package download checked by Socket Firewall.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          sfw: true
          cache: true
          cache-toolchain: true
          # Only pushes to main save caches; pull requests reuse them.
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Formatting, lint and types
        run: vp check
      - name: Interface checks
        run: vp run check:ui
      - name: Tests
        run: vp test
      - name: Build the interface
        run: vp build
      - name: Bundle the CLI and the Electron main process
        run: vp pack
