<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Folio's app mark on Apple's icon grid: an ink page with one highlighted line. -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="12"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#18181b" filter="url(#shadow)"/>
  <rect x="281" y="328" width="254" height="48" rx="24" fill="#ffffff" fill-opacity="0.4"/>
  <rect x="281" y="458" width="462" height="107" rx="20" fill="#ffe433"/>
  <rect x="281" y="647" width="347" height="48" rx="24" fill="#ffffff" fill-opacity="0.4"/>
</svg>
